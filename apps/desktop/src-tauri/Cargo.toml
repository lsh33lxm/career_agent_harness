[package]
name = "agent-career-harness-desktop"
version = "0.1.0"
description = "Desktop lifecycle shell for Agent Career Harness"
authors = ["Agent Career Harness"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_career_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }

